name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# CI 只需要读仓库
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 插件侧（JS）：语法校验。本仓没有 npm 依赖，不装依赖直接跑。
  check:
    name: check（node --check）
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: npm run check（lib / client / verification 语法）
        run: npm run check

      # 说明：JS 侧没有单测（无 test/ 目录，package.json 也没有 test 脚本），
      # 因此这里不跑 npm test；verification/*.mjs 是连真实 DSH + 训练器服务的验收脚本，只在本地手动跑。

  # 训练器侧（Python）：server/app/domains 下的 pytest 单测。
  pytest:
    name: pytest（server/app/domains）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装 pytest
        run: python -m pip install --upgrade pip pytest

      - name: python -m pytest app/domains
        run: python -m pytest app/domains -q
